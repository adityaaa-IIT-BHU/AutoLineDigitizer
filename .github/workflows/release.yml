name: Build and Release

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.2.0). Leave empty for artifact-only build.'
        required: false
        default: ''

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<71" wheel pyyaml addict yapf
          pip install pyinstaller "flet==0.24.1"
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy Pillow
          CC=clang CXX=clang++ CFLAGS='-stdlib=libc++' MMCV_WITH_OPS=1 pip install mmcv-full==1.7.2 --no-build-isolation
          pip install opencv-python-headless scipy scikit-image bresenham easyocr terminaltables matplotlib pycocotools
          pip install pymupdf anthropic huggingface_hub jsonschema "transformers>=4.43"

      - name: Cache PP-DocLayoutV2 weights
        uses: actions/cache@v4
        with:
          path: pp_doclayoutv2_weights
          key: pp-doclayoutv2-weights-v1

      - name: Download PP-DocLayoutV2 weights (MinerU figure detector)
        run: |
          if [ ! -f pp_doclayoutv2_weights/models/Layout/PP-DocLayoutV2/model.safetensors ]; then
            python src/mineru_layout/download_weights.py pp_doclayoutv2_weights
          fi
          ls -la pp_doclayoutv2_weights/models/Layout/PP-DocLayoutV2/

      - name: Download EasyOCR models
        run: |
          mkdir -p easyocr_models
          curl -L -o easyocr_models/craft_mlt_25k.pth https://github.com/JaidedAI/EasyOCR/releases/download/pre-v1.1.6/craft_mlt_25k.zip
          curl -L -o easyocr_models/english_g2.pth https://github.com/JaidedAI/EasyOCR/releases/download/v1.3/english_g2.zip
          cd easyocr_models
          python -c "
          import zipfile, os
          for f in ['craft_mlt_25k.pth', 'english_g2.pth']:
              zf = f  # downloaded as .pth but is actually .zip
              base = os.path.splitext(f)[0]
              os.rename(f, base + '.zip')
              with zipfile.ZipFile(base + '.zip', 'r') as z:
                  z.extractall('.')
              os.remove(base + '.zip')
          "
          ls -la

      - name: Embed version
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          sed -i '' "s/APP_VERSION = \"dev\"/APP_VERSION = \"${VERSION#v}\"/" src/desktop_app.py

      - name: Build macOS app
        run: pyinstaller AutoLineDigitizer.spec --noconfirm

      - name: Create ZIP archive
        run: |
          cd dist
          zip -r AutoLineDigitizer-macOS.zip AutoLineDigitizer.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoLineDigitizer-macOS
          path: dist/AutoLineDigitizer-macOS.zip
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<71" wheel pyyaml addict yapf
          pip install pyinstaller "flet==0.24.1"
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy Pillow
          pip install mmcv-full==1.7.2 --no-build-isolation
          pip install opencv-python-headless scipy scikit-image bresenham easyocr terminaltables matplotlib pycocotools
          pip install pymupdf anthropic huggingface_hub jsonschema "transformers>=4.43"
        env:
          MMCV_WITH_OPS: '1'

      - name: Cache PP-DocLayoutV2 weights
        uses: actions/cache@v4
        with:
          path: pp_doclayoutv2_weights
          key: pp-doclayoutv2-weights-v1

      - name: Download PP-DocLayoutV2 weights (MinerU figure detector)
        run: |
          if (-not (Test-Path "pp_doclayoutv2_weights/models/Layout/PP-DocLayoutV2/model.safetensors")) {
            python src/mineru_layout/download_weights.py pp_doclayoutv2_weights
          }
          Get-ChildItem pp_doclayoutv2_weights/models/Layout/PP-DocLayoutV2/

      - name: Download EasyOCR models
        run: |
          mkdir easyocr_models
          Invoke-WebRequest -Uri "https://github.com/JaidedAI/EasyOCR/releases/download/pre-v1.1.6/craft_mlt_25k.zip" -OutFile "easyocr_models\craft_mlt_25k.zip"
          Invoke-WebRequest -Uri "https://github.com/JaidedAI/EasyOCR/releases/download/v1.3/english_g2.zip" -OutFile "easyocr_models\english_g2.zip"
          Expand-Archive -Path "easyocr_models\craft_mlt_25k.zip" -DestinationPath "easyocr_models" -Force
          Expand-Archive -Path "easyocr_models\english_g2.zip" -DestinationPath "easyocr_models" -Force
          Remove-Item "easyocr_models\*.zip"
          Get-ChildItem easyocr_models

      - name: Embed version
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $version = $version -replace '^v', ''
          (Get-Content src/desktop_app.py) -replace 'APP_VERSION = "dev"', "APP_VERSION = `"$version`"" | Set-Content src/desktop_app.py

      - name: Build Windows app
        run: pyinstaller AutoLineDigitizer.spec --noconfirm

      - name: Create ZIP archive
        run: Compress-Archive -Path dist\AutoLineDigitizer -DestinationPath dist\AutoLineDigitizer-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoLineDigitizer-Windows
          path: dist/AutoLineDigitizer-Windows.zip
          retention-days: 7

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.version != ''
    permissions:
      contents: write
    steps:
      - name: Get version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoLineDigitizer-macOS
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AutoLineDigitizer-Windows
          path: artifacts/

      # Ship the ML weights ON the release page so this one page has everything
      # — nothing else to download afterwards. (A single all-in-one zip would
      # exceed GitHub's 2 GiB per-asset limit: app ~1.6 G + weights ~2 G.)
      - name: Fetch model weights (attached to the release)
        run: |
          curl -L -o artifacts/iter_3000.pth \
            https://github.com/t29mato/AutoLineDigitizer/releases/download/models/iter_3000.pth
          curl -L -o artifacts/checkpoint.pth \
            https://github.com/t29mato/AutoLineDigitizer/releases/download/models/checkpoint.pth
          ls -la artifacts/

      # Checksums so anyone can verify a download survived the trip
      # (truncated browser downloads of the 1.5 GB zip are a real support case)
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum AutoLineDigitizer-macOS.zip AutoLineDigitizer-Windows.zip \
                    iter_3000.pth checkpoint.pth > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            artifacts/AutoLineDigitizer-macOS.zip
            artifacts/AutoLineDigitizer-Windows.zip
            artifacts/iter_3000.pth
            artifacts/checkpoint.pth
            artifacts/checksums.txt
          body: |
            ## AutoLineDigitizer ${{ steps.get_version.outputs.version }}

            **Everything you need is on this page — after downloading, no internet connection or further downloads are required.**

            ### Download (all from this page)
            | File | What it is |
            |---|---|
            | `AutoLineDigitizer-macOS.zip` | The app — macOS (Apple Silicon) |
            | `AutoLineDigitizer-Windows.zip` | The app — Windows |
            | `iter_3000.pth` | LineFormer weights (curve extraction) |
            | `checkpoint.pth` | ChartDete weights (axis detection) |

            Grab the zip for your platform **plus the two `.pth` files**. (They can't be inside the zip — GitHub caps release files at 2 GiB.)

            ### Installation

            #### macOS
            1. Unzip `AutoLineDigitizer-macOS.zip`, move `AutoLineDigitizer.app` to Applications
            2. **First launch — macOS will warn it "could not verify the app is free of malware"** (the app is not signed with an Apple Developer ID; it is open source and built by GitHub CI from this repository). To open it anyway, do ONE of:
               - Double-click the app (it will be blocked) → **System Settings → Privacy & Security** → scroll to *"AutoLineDigitizer was blocked…"* → **Open Anyway**; or
               - In Terminal: `xattr -dr com.apple.quarantine /Applications/AutoLineDigitizer.app`
            3. In the app, click **Import Models** (under the Line Model dropdown) and select the two downloaded `.pth` files — done, fully offline from here

            #### Windows
            1. Unzip `AutoLineDigitizer-Windows.zip`, run `AutoLineDigitizer\AutoLineDigitizer.exe` (if SmartScreen warns, click "More info" → "Run anyway")
            2. In the app, click **Import Models** and select the two downloaded `.pth` files

            > If you skip the `.pth` downloads, the app offers to fetch them automatically on first launch (needs internet).

            ### Optional
            - **Claude-assisted curation** (axis reading, legend naming, KMDS verification): add an Anthropic API key in Settings
            - **Push to Starrydata3** (local KMDS database): https://github.com/adityaaa-IIT-BHU/starrydata3
            - **Push to Starrydata2** (internal API, token auth): save your api-token to `~/.sd2_token`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
